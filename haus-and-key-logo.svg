<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@500&amp;display=swap');
    </style>
  </defs>

  <!-- Badge background -->
  <rect x="0" y="8" width="64" height="64" rx="12" ry="12" fill="#2d6a8a"/>

  <!-- H&K text in badge -->
  <text
    x="32"
    y="48"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="700"
    fill="#ffffff"
